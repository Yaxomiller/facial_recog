<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Attendance Demo</title>
<style>
  :root {
    --bg: #0f141c;
    --panel: #18202c;
    --panel2: #131a24;
    --line: #26303f;
    --text: #e9eef6;
    --muted: #90a0b8;
    --accent: #f3aa2c;
    --blue: #2f7bef;
    --gap: 8px;
    --osk-h: 0px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  /* The shell fills the screen exactly. `body` is a fixed-height flex column
     with overflow hidden, so the PAGE can never scroll; each view sizes its
     own parts to the space left over. Only a genuinely unbounded list (the
     database and history tables) gets its own internal scroller. */
  html, body { height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    gap: var(--gap);
    padding: 6px 8px calc(8px + env(safe-area-inset-bottom, 0px));
    touch-action: pan-x pan-y;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
  }

  /* Every view fills the space under the header and never scrolls itself. */
  .view {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: var(--gap);
  }
  .hidden { display: none !important; }
  input { -webkit-user-select: text; user-select: text; }

  /* ---------- header ---------- */
  header {
    flex: 0 0 auto;
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }
  header h1 { font-size: clamp(15px, 2.6vh, 21px); font-weight: 700; letter-spacing: 0.3px; }
  .hdr-right { display: flex; align-items: center; gap: 8px; }
  .demo-tag {
    font-size: 10px; font-weight: 700; letter-spacing: 0.08em;
    text-transform: uppercase; color: #0f141c; background: var(--accent);
    padding: 3px 7px; border-radius: 999px;
  }
  .count { font-size: 11px; color: var(--muted); white-space: nowrap; }
  #homeBtn { padding: 6px 12px; font-size: 13px; }

  /* Live board power draw (test build). Hidden unless the INA745B answers,
     so boards without it lose no vertical space at all. */
  .powerbar {
    flex: 0 0 auto;
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; flex-wrap: wrap;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 8px; padding: 5px 10px;
  }
  .powerbar b { font-size: 10px; font-weight: 700; letter-spacing: .08em; color: var(--accent); text-transform: uppercase; }
  .powerbar span { font-size: 12px; font-variant-numeric: tabular-nums; }
  .powerbar .dim { color: var(--muted); font-size: 10px; }

  /* ---------- home tiles ---------- */
  .tiles {
    flex: 1 1 auto;
    min-height: 0;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: var(--gap);
  }
  .tile {
    background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
    color: var(--text); text-align: center; cursor: pointer; font-family: inherit;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: clamp(4px, 1.2vh, 12px); padding: clamp(6px, 1.5vh, 18px);
    min-width: 0; min-height: 0;
  }
  .tile:active { background: #212c3b; }
  .tile svg {
    flex: 0 0 auto;
    width: clamp(34px, 11vh, 88px); height: clamp(34px, 11vh, 88px);
    fill: var(--accent);
  }
  .tile strong { font-size: clamp(16px, 3.3vh, 32px); line-height: 1.1; }
  .tile span { font-size: clamp(10px, 1.7vh, 16px); color: var(--muted); line-height: 1.25; }

  /* ---------- shared pieces ---------- */
  .status {
    flex: 0 0 auto;
    padding: 9px 11px; border-radius: 8px; background: #223049;
    font-size: clamp(12px, 1.9vh, 15px); line-height: 1.3;
  }
  .status.ok { background: #17402a; color: #9fe2b5; }
  .status.warn { background: #45351c; color: #f2c68b; }
  .status.err { background: #45222a; color: #f2a19b; }
  .banner {
    flex: 0 0 auto;
    padding: 7px 10px; border-radius: 7px;
    background: #45351c; color: #f2c68b; font-size: 11px; line-height: 1.3;
  }

  button {
    padding: clamp(9px, 1.8vh, 15px); border: 0; border-radius: 9px;
    background: var(--blue); color: #fff; font-family: inherit;
    font-size: clamp(13px, 2.1vh, 18px); font-weight: 600; cursor: pointer;
  }
  button:disabled { background: #2c3646; color: #6d7a90; }
  button.sec { background: #26303f; }
  button.danger { background: #a83c37; }
  .row { flex: 0 0 auto; display: flex; gap: var(--gap); }
  .row button { flex: 1 1 0; min-width: 0; }

  /* The flexible middle of a view: camera preview or the reading cards. */
  .stage { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
  .video {
    flex: 1 1 auto; min-height: 0;
    background: #000; border: 1px solid var(--line); border-radius: 10px;
    overflow: hidden; display: flex; align-items: center; justify-content: center;
  }
  .video img { width: 100%; height: 100%; object-fit: contain; display: block; }

  /* ---------- breath readings ---------- */
  .readings {
    flex: 1 1 auto; min-height: 0;
    display: grid; grid-template-columns: 1fr 1fr; gap: var(--gap);
  }
  .reading {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: clamp(3px, 0.8vh, 8px); padding: 10px; min-width: 0; text-align: center;
  }
  .reading .k {
    font-size: clamp(10px, 1.6vh, 14px); color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.07em;
  }
  .reading .v {
    font-size: clamp(24px, 6.4vh, 58px); font-weight: 700; line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .reading .v i { font-style: normal; font-size: 0.45em; color: var(--muted); margin-left: 3px; }
  .reading .u {
    font-size: clamp(9px, 1.5vh, 12px); color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.06em;
  }

  .infobar {
    flex: 0 0 auto;
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 8px 11px; min-width: 0;
  }
  .infobar b { font-size: clamp(13px, 2.1vh, 18px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .infobar span { font-size: 11px; color: var(--muted); white-space: nowrap; }
  .chip {
    display: inline-block; padding: 3px 10px; border-radius: 999px;
    font-size: clamp(10px, 1.6vh, 12px); font-weight: 600;
    background: #26303f; color: var(--muted);
  }
  .chip.on { background: #1d3350; color: #9dc4ff; }

  /* ---------- enroll ---------- */
  .fields { flex: 0 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: var(--gap); }
  .fields label {
    display: block; font-size: 10px; color: var(--muted); margin-bottom: 3px;
    text-transform: uppercase; letter-spacing: 0.05em;
  }
  .fields input {
    width: 100%; padding: clamp(7px, 1.5vh, 12px) 10px; border-radius: 7px;
    border: 1px solid #33405a; background: #0b1017; color: var(--text);
    font-family: inherit; font-size: clamp(13px, 2vh, 16px);
  }
  /* Three fixed slots, so the row's height never changes as photos come and go. */
  .thumbs { flex: 0 0 auto; display: flex; gap: var(--gap); height: clamp(44px, 8.5vh, 76px); }
  .slot {
    position: relative; flex: 0 0 auto;
    width: clamp(44px, 8.5vh, 76px); height: 100%;
    border-radius: 8px; border: 1px dashed #33405a; background: var(--panel2);
    display: flex; align-items: center; justify-content: center;
    color: #4d5b74; font-size: 14px; font-weight: 700;
  }
  .slot.filled { border-style: solid; }
  .slot img { width: 100%; height: 100%; object-fit: cover; border-radius: 8px; display: block; }
  .slot-del {
    position: absolute; top: -6px; right: -6px; width: 20px; height: 20px;
    padding: 0; border-radius: 50%; background: #a83c37; color: #fff;
    font-size: 13px; font-weight: 700; line-height: 1;
    display: flex; align-items: center; justify-content: center;
  }

  /* ---------- tables ---------- */
  .tablewrap {
    flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
  }
  table { width: 100%; border-collapse: collapse; font-size: clamp(10px, 1.7vh, 13px); }
  thead th {
    position: sticky; top: 0; z-index: 1;
    background: var(--panel); color: var(--muted); font-weight: 600; text-align: left;
    padding: 8px 6px; border-bottom: 1px solid var(--line);
    font-size: clamp(9px, 1.5vh, 11px); text-transform: uppercase; letter-spacing: 0.05em;
  }
  tbody td { padding: 7px 6px; border-bottom: 1px solid #1e2733; }
  tbody tr:last-child td { border-bottom: 0; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.act, th.act { text-align: right; width: 1%; white-space: nowrap; }
  .mini { padding: 4px 9px; font-size: 11px; border-radius: 6px; }

  /* ---------- on-screen keyboard ---------- */
  .osk {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 1000;
    display: flex; flex-direction: column; gap: 5px;
    padding: 6px 5px calc(6px + env(safe-area-inset-bottom, 0px));
    background: rgba(8, 11, 16, 0.98);
    box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.5);
  }
  .osk-row { display: flex; gap: 5px; justify-content: center; }
  .osk-key {
    flex: 1 1 0; min-width: 0; height: clamp(32px, 6.2vh, 46px); border-radius: 7px;
    background: #2b3547; color: #f2f5fa; font-size: clamp(13px, 2.2vh, 16px); font-weight: 600;
    display: flex; align-items: center; justify-content: center;
    touch-action: manipulation; padding: 0;
  }
  .osk-key:active { background: #3d4a63; }
  .osk-key[data-k="space"] { flex: 4 1 0; }
  .osk-key[data-k="shift"], .osk-key[data-k="backspace"],
  .osk-key[data-k="symbols"], .osk-key[data-k="abc"] { flex: 1.5 1 0; background: #1f2734; font-size: 13px; }
  .osk-key[data-k="done"] { flex: 1.6 1 0; background: var(--blue); }

  /* While the keyboard is up it covers the bottom of the screen. Reserve that
     height and drop the camera preview so the fields being typed into stay
     visible -- without this the only way to reach them would be scrolling. */
  body.osk-open .view { padding-bottom: var(--osk-h); }
  body.osk-open #enrollMedia, body.osk-open #enrollCamRow, body.osk-open #thumbs { display: none !important; }

  /* On a very short screen a full-size keyboard would push the fields off the
     bottom. Tighten the keys and drop the hint line so what is being typed
     into stays on screen instead of needing a scroll. */
  @media (max-height: 430px) {
    .osk-key { height: clamp(26px, 6.2vh, 46px); }
    body.osk-open #enrollStatus { display: none; }
    body.osk-open .fields input { padding: 6px 9px; }
  }
</style>
</head>
<body>

<!-- TEMPORARY TESTING: live board power draw. Hidden unless the INA745B
     monitor is present and responding. -->
<div class="powerbar hidden" id="powerCard">
  <b>Power (test)</b>
  <span id="powerNow">&mdash;</span>

<header>

<!-- HOME -->
<div id="viewHome" class="view">
  <div class="tiles">

<canvas id="capture" class="hidden"></canvas>

<script>
"use strict";

// When true the breath readings always display clean placeholders (0.000 BAC
// and a 0.000 confidence score) regardless of what the sensor measured. Set
// to true for a scripted demo; false shows the real values.
const DEMO_PLACEHOLDER_READINGS = false;

const CAMERA_ID = "demo-front-camera";
const SCAN_DELAY_MS = 300;
// Smaller frames than the kiosk app: far less CPU/memory per request, which
// matters a lot on a 1GB board. Recognition quality is unaffected at this size.
const FRAME_WIDTH = 640;
const UNRECOGNIZED_MS = 12000;
const REQUIRED_PHOTOS = 3;

// Display calibration, mirroring src/v2/config.py. The server sends the
// converted figures (alcohol_bac_percent / cannabis_confidence) and those are
// always preferred; these constants only cover a record stored before the
// backend computed them, so the screen never falls back to raw mV*s.
const BAC_ZERO_READING = 30;      // raw integral that means 0.00 %BAC
const BAC_REF_READING = 1500;     // raw integral that means BAC_REF_PERCENT
const BAC_REF_PERCENT = 0.2;
const CANNABIS_UL_THRESHOLD = 500;  // upper/lower ratio that scores 1.000

const el = (id) => document.getElementById(id);
const VIEWS = {
  home: { node: "viewHome", title: "Attendance" },
  scan: { node: "viewScan", title: "Scan" },
  enroll: { node: "viewEnroll", title: "New User" },
  database: { node: "viewDatabase", title: "Database" },
  history: { node: "viewHistory", title: "History" },
};

let currentView = "home";
let scanning = false, scanTimer = null, inFlight = false, faceLocked = false;
let unrecognizedSince = 0, currentMatch = null, breathSessionId = null;
let enrollFrames = [], enrollCamOn = false;

function setStatus(node, text, tone) {
  node.textContent = text;
  node.className = "status" + (tone ? " " + tone : "");
}

async function api(path, opts) {
  opts = opts || {};
  const headers = { Accept: "application/json" };
  let body = opts.body || null;
  if (opts.json) { headers["Content-Type"] = "application/json"; body = JSON.stringify(opts.json); }
  const res = await fetch(path, { method: opts.method || "GET", headers: headers, body: body, cache: "no-store" });
  const text = await res.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch (e) { data = null; }
  if (!res.ok) throw new Error((data && (data.detail || data.message)) || text || ("Request failed (" + res.status + ")"));
  return data;
}

/* ---------- reported figures ----------
   Alcohol reports %BAC and cannabis reports a 0-1 confidence score. The raw
   mV*s integrals and the raw upper/lower ratio are never shown. */

// %BAC from the raw alcohol integral: a straight line through the two
// calibration points. Anything at or below the sober reading is baseline
// noise, not negative alcohol, so it reports 0.000.
function bacPercent(row) {
  const given = Number(row && row.alcohol_bac_percent);
  if (Number.isFinite(given)) return Math.max(0, given);
  const span = BAC_REF_READING - BAC_ZERO_READING;
  if (span <= 0) return 0;
  const raw = Number(row && row.alcohol_ppb) || 0;
  return Math.max(0, (raw - BAC_ZERO_READING) * BAC_REF_PERCENT / span);
}

// The cannabis upper/lower area ratio normalised against its calibration
// threshold, so the score always reads between 0.000 and 1.000.
function confidenceScore(row) {
  const given = Number(row && row.cannabis_confidence);
  if (Number.isFinite(given)) return Math.min(1, Math.max(0, given));
  if (CANNABIS_UL_THRESHOLD <= 0) return 0;
  const ratio = Number(row && row.cannabis_ratio) || 0;
  return Math.min(1, Math.max(0, ratio / CANNABIS_UL_THRESHOLD));
}

function fmtBac(row) { return (DEMO_PLACEHOLDER_READINGS ? 0 : bacPercent(row)).toFixed(3); }
function fmtConfidence(row) { return (DEMO_PLACEHOLDER_READINGS ? 0 : confidenceScore(row)).toFixed(3); }

function showView(name) {
  Object.keys(VIEWS).forEach((key) => el(VIEWS[key].node).classList.add("hidden"));
  el(VIEWS[name].node).classList.remove("hidden");
  el("viewTitle").textContent = VIEWS[name].title;
  el("homeBtn").classList.toggle("hidden", name === "home");
  el("homeStats").classList.toggle("hidden", name !== "home");
  currentView = name;

  if (name !== "scan") stopScan(true);
  if (name !== "enroll") stopEnrollCam();
  if (name === "database") loadWorkers();
  if (name === "history") loadHistory();
  if (name === "home" || name === "scan") loadStats();
}

// ---------- shared camera helpers ----------
function streamUrl() { return "/api/v2/local-camera/stream.mjpg?ts=" + Date.now(); }

function grabFrame(imgEl, quality) {
  return new Promise((resolve) => {
    if (!imgEl.naturalWidth) return resolve(null);
    let w = imgEl.naturalWidth, h = imgEl.naturalHeight;
    if (w > FRAME_WIDTH) { h = Math.round(h * (FRAME_WIDTH / w)); w = FRAME_WIDTH; }
    const c = el("capture");
    c.width = w; c.height = h;
    c.getContext("2d").drawImage(imgEl, 0, 0, w, h);
    c.toBlob((b) => resolve(b), "image/jpeg", quality || 0.82);
  });
}

// ---------- SCAN ----------
// The scan view swaps between three stages in place. Each stage shows exactly
// one info bar and one button row, so the layout height never changes and the
// view always fits the screen.
function setScanStage(stage) {
  el("previewWrap").classList.toggle("hidden", stage === "result");
  el("resultCard").classList.toggle("hidden", stage !== "result");
  el("matchCard").classList.toggle("hidden", stage !== "match");
  el("attBar").classList.toggle("hidden", stage !== "result");
  el("actIdle").classList.toggle("hidden", stage !== "idle");
  el("actMatch").classList.toggle("hidden", stage !== "match");
  el("actResult").classList.toggle("hidden", stage !== "result");
}

function coachMessage(reason) {
  const t = String(reason || "").toLowerCase();
  if (!t || t.indexOf("pending") >= 0 || t.indexOf("waiting") >= 0) return "Verifying identity. Hold still.";
  if (t.indexOf("multiple faces") >= 0 || t.indexOf("one employee") >= 0) return "One person at a time.";
  if (t.indexOf("too small") >= 0) return "Move a little closer to the camera.";
  if (t.indexOf("blur") >= 0 || t.indexOf("not stable") >= 0) return "Hold still for a moment.";
  if (t.indexOf("re-enroll") >= 0 || t.indexOf("no enrolled") >= 0) return "BLOCKED:Enrollment incomplete. Add this employee again with 3 photos.";
  return "UNKNOWN:Verifying identity. Keep looking at the camera.";
}

async function startScan() {
  if (scanning) return;
  scanning = true; faceLocked = false; unrecognizedSince = 0; currentMatch = null;
  setScanStage("idle");
  el("startBtn").disabled = true;
  setStatus(el("scanStatus"), "Starting camera…");
  try {
    await api("/api/v2/local-camera/start", { method: "POST" });
    el("preview").src = streamUrl();
    setStatus(el("scanStatus"), "Camera live. Look at the screen.");
    scanTimer = setTimeout(runScan, 700);
  } catch (e) {
    scanning = false; el("startBtn").disabled = false;
    setStatus(el("scanStatus"), e.message, "err");
  }
}

function stopScan(silent) {
  if (!scanning && silent) { return; }
  scanning = false; faceLocked = false; unrecognizedSince = 0;
  if (scanTimer) { clearTimeout(scanTimer); scanTimer = null; }
  el("preview").removeAttribute("src");
  el("startBtn").disabled = false;
  fetch("/api/v2/local-camera/stop", { method: "POST" }).catch(() => {});
  if (!silent) setStatus(el("scanStatus"), "Scan stopped.");
}

function scheduleScan() { if (scanning && !currentMatch) scanTimer = setTimeout(runScan, SCAN_DELAY_MS); }

async function runScan() {
  if (!scanning || inFlight || currentMatch) return;
  inFlight = true;
  try {
    if (!faceLocked) {
      const blob = await grabFrame(el("preview"), 0.8);
      if (!blob) return;
      const fd = new FormData(); fd.append("image", blob, "d.jpg");
      const det = await api("/api/v2/detections", { method: "POST", body: fd });
      const n = det.detected_faces || 0;
      if (n === 0) { unrecognizedSince = 0; setStatus(el("scanStatus"), "No face detected."); return; }
      if (n > 1) { unrecognizedSince = 0; setStatus(el("scanStatus"), "One person at a time.", "warn"); return; }
      faceLocked = true;
      setStatus(el("scanStatus"), "Face detected. Hold still.");
    }

    const blob = await grabFrame(el("preview"), 0.85);
    if (!blob) return;
    const fd = new FormData();
    fd.append("camera_id", CAMERA_ID);
    fd.append("top_k", "3");
    fd.append("image", blob, "s.jpg");
    const res = await api("/api/v2/recognitions", { method: "POST", body: fd });

    if (res.matches && res.matches.length) {
      currentMatch = res.matches[0];
      unrecognizedSince = 0;
      setStatus(el("scanStatus"), currentMatch.name + " identified.", "ok");
      el("matchName").textContent = currentMatch.name;
      // Spelled out as a FACE MATCH score so it is never mistaken for the
      // cannabis confidence score shown on the result screen.
      el("matchMeta").textContent = "ID " + currentMatch.employee_code
        + " · face match " + Number(currentMatch.score).toFixed(2);
      el("exhaleBtn").disabled = false;
      el("exhaleBtn").textContent = "Exhale";
      setScanStage("match");
      return;
    }

    const n = res.detected_faces || 0;
    if (n === 0) { faceLocked = false; unrecognizedSince = 0; setStatus(el("scanStatus"), "No face detected."); return; }
    if (n > 1) { faceLocked = false; unrecognizedSince = 0; setStatus(el("scanStatus"), "One person at a time.", "warn"); return; }

    let reason = "";
    if (res.debug_faces) { for (let i = 0; i < res.debug_faces.length; i++) { if (res.debug_faces[i].reason) { reason = res.debug_faces[i].reason; break; } } }
    const msg = coachMessage(reason);
    if (msg.indexOf("BLOCKED:") === 0) { setStatus(el("scanStatus"), msg.slice(8), "err"); return; }
    const now = Date.now();
    if (!unrecognizedSince) unrecognizedSince = now;
    if (msg.indexOf("UNKNOWN:") === 0) {
      if (now - unrecognizedSince >= UNRECOGNIZED_MS) {
        setStatus(el("scanStatus"), "Face not recognized. Try again or add this user first.", "err");
        return;
      }
      setStatus(el("scanStatus"), msg.slice(8));
      return;
    }
    setStatus(el("scanStatus"), msg);
  } catch (e) {
    if (scanning) setStatus(el("scanStatus"), e.message, "err");
  } finally {
    inFlight = false;
    scheduleScan();
  }
}

async function runExhale() {
  if (!currentMatch || breathSessionId) return;
  el("exhaleBtn").disabled = true;
  try {
    const session = await api("/api/v2/breath-tests/start", {
      method: "POST",
      json: { worker_id: currentMatch.worker_id, camera_id: CAMERA_ID },
    });
    breathSessionId = session.session_id;

    // The sensor board runs PURGE (pump on, sensors warming) and BASELINE
    // (fresh-air zero) before the blow window opens. Prompting for the exhale
    // during those phases would measure air, not breath.
    const prep = Math.max(0, Math.round(Number(session.blow_delay_seconds) || 0));
    for (let r = prep; r > 0; r--) {
      setStatus(el("scanStatus"), "Preparing sensor — " + r + "s. Do not blow yet.", "warn");
      el("exhaleBtn").textContent = "Wait " + r + "s";
      await new Promise((res) => setTimeout(res, 1000));
    }

    const secs = Math.max(1, Math.ceil(Number(session.sample_seconds) || 10));
    for (let r = secs; r > 0; r--) {
      setStatus(el("scanStatus"), "Exhale now — " + r + "s. Keep your face in view.", "warn");
      el("exhaleBtn").textContent = "Exhale " + r + "s";
      await new Promise((res) => setTimeout(res, 1000));
    }
    setStatus(el("scanStatus"), "Analyzing breath sample…");
    const result = await api("/api/v2/breath-tests/complete", {
      method: "POST",
      json: { session_id: breathSessionId, matched_score: currentMatch.score },
    });
    breathSessionId = null;
    showBreathResult(result);
    stopScan(true);
  } catch (e) {
    if (breathSessionId) {
      fetch("/api/v2/breath-tests/" + encodeURIComponent(breathSessionId), { method: "DELETE" }).catch(() => {});
      breathSessionId = null;
    }
    setStatus(el("scanStatus"), e.message, "err");
    el("exhaleBtn").disabled = false;
    el("exhaleBtn").textContent = "Exhale";
  }
}

// The screen reports the two operator-facing figures the backend derived from
// the exhale -- %BAC and the cannabis confidence score. No raw units and no
// pass/fail verdict; whether attendance was marked is the only status shown.
function showBreathResult(result) {
  el("alcVal").textContent = fmtBac(result);
  el("confVal").textContent = fmtConfidence(result);

  el("attName").textContent = result.name || "Attendance";
  el("attChip").textContent = result.attendance_marked ? "Attendance marked" : "Not marked";
  el("attChip").className = "chip" + (result.attendance_marked ? " on" : "");
  setScanStage("result");

  if (result.attendance_marked) setStatus(el("scanStatus"), result.name + " — attendance marked.", "ok");
  else setStatus(el("scanStatus"), result.name + " — attendance not marked (already marked recently).", "warn");
}

function resetScanFlow() {
  currentMatch = null; faceLocked = false; unrecognizedSince = 0;
  setScanStage("idle");
  startScan();
}

// ---------- ENROLL ----------
async function startEnrollCam() {
  try {
    await api("/api/v2/local-camera/start", { method: "POST" });
    el("enrollPreview").src = streamUrl();
    enrollCamOn = true;
    el("captureBtn").disabled = false;
    setStatus(el("enrollStatus"), "Camera live. Capture 3 photos: front, slight left, slight right.");
  } catch (e) {
    setStatus(el("enrollStatus"), e.message, "err");
  }
}

function stopEnrollCam() {
  if (!enrollCamOn) return;
  enrollCamOn = false;
  el("enrollPreview").removeAttribute("src");
  el("captureBtn").disabled = true;
  fetch("/api/v2/local-camera/stop", { method: "POST" }).catch(() => {});
}

async function capturePhoto() {
  if (enrollFrames.length >= REQUIRED_PHOTOS) {
    setStatus(el("enrollStatus"), "All 3 photos captured. Delete one to retake it.", "warn");
    return;
  }
  const blob = await grabFrame(el("enrollPreview"), 0.9);
  if (!blob) { setStatus(el("enrollStatus"), "Camera frame not ready yet.", "warn"); return; }
  enrollFrames.push(blob);
  renderThumbs();
  const hints = ["Now turn slightly left.", "Now turn slightly right.", "All photos captured."];
  setStatus(el("enrollStatus"), "Photo " + enrollFrames.length + " of 3 captured. " + (hints[enrollFrames.length - 1] || ""));
}

// Always three slots: the row keeps a constant height, so capturing or
// deleting a photo never reflows the rest of the view.
function renderThumbs() {
  const box = el("thumbs");
  // Revoke previous object URLs before rebuilding: without this every
  // recapture leaks a full JPEG in browser memory, which matters on a 1GB board.
  [...box.querySelectorAll("img")].forEach((img) => URL.revokeObjectURL(img.src));
  box.innerHTML = "";
  for (let index = 0; index < REQUIRED_PHOTOS; index++) {
    const slot = document.createElement("div");
    slot.className = "slot";
    const blob = enrollFrames[index];
    if (!blob) {
      slot.textContent = String(index + 1);
    } else {
      slot.classList.add("filled");
      const img = document.createElement("img");
      img.src = URL.createObjectURL(blob);
      const del = document.createElement("button");
      del.className = "slot-del";
      del.type = "button";
      del.textContent = "×";
      del.title = "Delete this photo";
      del.addEventListener("click", () => removePhoto(index));
      slot.appendChild(img);
      slot.appendChild(del);
    }
    box.appendChild(slot);
  }
  updateSaveButton();
}

function removePhoto(index) {
  enrollFrames.splice(index, 1);
  renderThumbs();
  setStatus(el("enrollStatus"), "Photo removed. " + enrollFrames.length + " of 3 captured. Retake it when ready.");
}

function clearPhotos() {
  enrollFrames = [];
  renderThumbs();
  setStatus(el("enrollStatus"), "All photos cleared. Capture 3 fresh photos.");
}

function updateSaveButton() {
  const ready = enrollFrames.length >= REQUIRED_PHOTOS;
  el("saveUserBtn").disabled = !ready;
  el("saveUserBtn").textContent = ready ? "Save User" : "Need 3 Photos (" + enrollFrames.length + "/3)";
  el("clearPhotosBtn").disabled = enrollFrames.length === 0;
}

async function saveUser() {
  const code = el("empCode").value.trim();
  const name = el("empName").value.trim();
  if (!code || !name) { setStatus(el("enrollStatus"), "Enter both Employee ID and Full Name.", "warn"); return; }
  if (enrollFrames.length < REQUIRED_PHOTOS) { setStatus(el("enrollStatus"), "Capture 3 photos first.", "warn"); return; }

  el("saveUserBtn").disabled = true;
  setStatus(el("enrollStatus"), "Saving employee…");
  try {
    const fd = new FormData();
    fd.append("employee_code", code);
    fd.append("name", name);
    fd.append("replace_existing", "true");
    for (let i = 0; i < enrollFrames.length; i++) fd.append("images", enrollFrames[i], "p" + i + ".jpg");
    const res = await api("/api/v2/workers/enroll", { method: "POST", body: fd });
    const savedName = (res && res.worker && res.worker.name) || name;
    setStatus(el("enrollStatus"), savedName + " saved with " + enrollFrames.length + " photos.", "ok");
    clearEnrollForm();
  } catch (e) {
    setStatus(el("enrollStatus"), e.message, "err");
    el("saveUserBtn").disabled = false;
  }
}

function clearEnrollForm() {
  enrollFrames = [];
  renderThumbs();
  el("empCode").value = "";
  el("empName").value = "";
}

// ---------- DATABASE ----------
async function loadWorkers() {
  try {
    const rows = await api("/api/v2/workers");
    const body = el("dbBody");
    if (!rows || !rows.length) { body.innerHTML = "<tr><td colspan='4'>No employees registered yet.</td></tr>"; return; }
    body.innerHTML = "";
    rows.forEach((w) => {
      const tr = document.createElement("tr");
      let added = "—";
      if (w.created_at) {
        const iso = w.created_at + (String(w.created_at).endsWith("Z") ? "" : "Z");
        added = new Date(iso).toLocaleDateString();
      }
      tr.appendChild(cell(w.employee_code));
      tr.appendChild(cell(w.name));
      tr.appendChild(cell(added));
      const td = document.createElement("td");
      td.className = "act";
      const btn = document.createElement("button");
      btn.className = "danger mini"; btn.textContent = "Delete";
      btn.addEventListener("click", () => removeWorker(w.employee_code, w.name));
      td.appendChild(btn); tr.appendChild(td);
      body.appendChild(tr);
    });
    setStatus(el("dbStatus"), rows.length + " employee(s) registered.");
  } catch (e) {
    setStatus(el("dbStatus"), e.message, "err");
  }
}

function cell(text, className) {
  const td = document.createElement("td");
  td.textContent = text == null ? "—" : String(text);
  if (className) td.className = className;
  return td;
}

async function removeWorker(code, name) {
  setStatus(el("dbStatus"), "Removing " + name + "…");
  try {
    await api("/api/v2/workers/" + encodeURIComponent(code), { method: "DELETE" });
    setStatus(el("dbStatus"), name + " removed.", "ok");
    loadWorkers();
  } catch (e) {
    setStatus(el("dbStatus"), e.message, "err");
  }
}

// ---------- HISTORY ----------
async function loadHistory() {
  try {
    const rows = await api("/api/v2/attendance?limit=50");
    const body = el("histBody");
    if (!rows || !rows.length) { body.innerHTML = "<tr><td colspan='6'>No attendance records yet.</td></tr>"; return; }
    body.innerHTML = "";
    rows.forEach((r) => {
      const iso = r.created_at + (String(r.created_at).endsWith("Z") ? "" : "Z");
      const when = new Date(iso);
      const tr = document.createElement("tr");
      tr.appendChild(cell(r.name));
      tr.appendChild(cell(when.toLocaleDateString() + " " + when.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })));
      tr.appendChild(cell(fmtBac(r), "num"));
      tr.appendChild(cell(fmtConfidence(r), "num"));

      const attTd = document.createElement("td");
      const chip = document.createElement("span");
      chip.className = "chip" + (r.attendance_marked ? " on" : "");
      chip.textContent = r.attendance_marked ? "Marked" : "—";
      attTd.appendChild(chip);
      tr.appendChild(attTd);

      const td = document.createElement("td");
      td.className = "act";
      const btn = document.createElement("button");
      btn.className = "danger mini";
      btn.textContent = "Delete";
      btn.addEventListener("click", () => removeAttendance(r.id, r.name));
      td.appendChild(btn);
      tr.appendChild(td);
      body.appendChild(tr);
    });
    setStatus(el("histStatus"), rows.length + " record(s).");
  } catch (e) {
    setStatus(el("histStatus"), e.message, "err");
  }
}

async function removeAttendance(attendanceId, name) {
  setStatus(el("histStatus"), "Removing record for " + name + "…");
  try {
    await api("/api/v2/attendance/" + encodeURIComponent(attendanceId), { method: "DELETE" });
    setStatus(el("histStatus"), "Record removed.", "ok");
    loadHistory();
  } catch (e) {
    setStatus(el("histStatus"), e.message, "err");
  }
}

async function loadStats() {
  try {
    const s = await api("/api/v2/status");
    el("homeStats").textContent = (s.indexed_workers != null ? s.indexed_workers : "—") + " registered";
    showSensorState(s);
  } catch (e) { el("homeStats").textContent = ""; }
}

// Make it obvious when the breath board is not actually driving the test.
// In mock mode the screen still walks through "preparing sensor" and
// "exhale now", but nothing is measured and the pump never runs — without
// this banner that looks like broken hardware.
function showSensorState(status) {
  const active = String(status.active_breath_analyzer || "");
  const banner = el("sensorBanner");
  if (!active || active === "spi") {
    banner.classList.add("hidden");
    return;
  }
  const requested = String(status.requested_breath_analyzer || "");
  if (requested === "mock") {
    banner.textContent = "Simulated sensor: readings are generated and the pump will not run. "
      + "Set ATTENDANCE_BREATH_ANALYZER_MODE=spi to use the breath board.";
  } else {
    // The board was asked for but could not be opened. Show the real reason
    // here rather than sending the operator to the journal.
    const reason = (status.warnings || []).find((w) => /breath|spi|pump|sensor/i.test(w));
    banner.textContent = "Breath board unavailable — simulated readings, pump will not run. "
      + (reason || "Check the server startup warnings.");
  }
  banner.classList.remove("hidden");
}

// ---------- wiring ----------
document.querySelectorAll("[data-go]").forEach((b) => b.addEventListener("click", () => showView(b.dataset.go)));
el("homeBtn").addEventListener("click", () => showView("home"));
el("startBtn").addEventListener("click", startScan);
el("stopBtn").addEventListener("click", () => stopScan(false));
el("exhaleBtn").addEventListener("click", runExhale);
el("scanAgainBtn").addEventListener("click", resetScanFlow);
el("enrollCamBtn").addEventListener("click", startEnrollCam);
el("captureBtn").addEventListener("click", capturePhoto);
el("clearPhotosBtn").addEventListener("click", clearPhotos);
el("saveUserBtn").addEventListener("click", saveUser);
el("dbRefreshBtn").addEventListener("click", loadWorkers);
el("histRefreshBtn").addEventListener("click", loadHistory);

renderThumbs();
showView("home");

// TEMPORARY TESTING: poll the board power monitor. The bar stays hidden
// unless the INA745B is present, so boards without it are unaffected.
(function pollPower() {
  const POLL_MS = 2000;
  async function tick() {
    try {
      const p = await api("/api/v2/power");
      if (p && p.enabled) {
        el("powerCard").classList.remove("hidden");
        el("powerNow").textContent =
          Number(p.power_mw).toFixed(0) + " mW   " +
          Number(p.current_ma).toFixed(0) + " mA   " +
          Number(p.bus_v).toFixed(2) + " V";
        el("powerStats").textContent =
          "avg " + Number(p.average_mw).toFixed(0) +
          "  peak " + Number(p.peak_mw).toFixed(0) +
          " mW  (" + Number(p.peak_ratio).toFixed(2) + "x)  n=" + p.samples;
      } else {
        el("powerCard").classList.add("hidden");
      }
    } catch (e) { /* monitor is optional; never disturb the app */ }
    setTimeout(tick, POLL_MS);
  }
  tick();
})();

// ---------- on-screen keyboard ----------
(function () {
  const L = {
    default: [["1","2","3","4","5","6","7","8","9","0"],["q","w","e","r","t","y","u","i","o","p"],
              ["a","s","d","f","g","h","j","k","l"],["shift","z","x","c","v","b","n","m","backspace"],
              ["symbols","@","space",".","done"]],
    shift:   [["1","2","3","4","5","6","7","8","9","0"],["Q","W","E","R","T","Y","U","I","O","P"],
              ["A","S","D","F","G","H","J","K","L"],["shift","Z","X","C","V","B","N","M","backspace"],
              ["symbols","@","space",".","done"]],
    symbols: [["1","2","3","4","5","6","7","8","9","0"],["!","@","#","$","%","^","&","*","(",")"],
              ["-","_","=","+","[","]","{","}",";"],[":","'","\"",",",".","/","?","backspace"],
              ["abc","space","done"]],
  };
  const LB = { shift: "⇧", backspace: "⌫", space: "space", done: "Done", symbols: "?123", abc: "ABC" };
  let active = null, layout = "default", hideTimer = null;
  const kb = document.createElement("div");
  kb.className = "osk hidden";
  document.body.appendChild(kb);

  function typeable(e) { return e && e.tagName === "INPUT" && ["text", "email", "number", "password", ""].indexOf((e.getAttribute("type") || "text").toLowerCase()) >= 0; }

  function render() {
    kb.innerHTML = "";
    (L[layout] || L.default).forEach((row) => {
      const r = document.createElement("div"); r.className = "osk-row";
      row.forEach((k) => {
        const b = document.createElement("button");
        b.type = "button"; b.className = "osk-key"; b.dataset.k = k;
        b.textContent = LB[k] || k;
        b.addEventListener("pointerdown", (ev) => ev.preventDefault());
        b.addEventListener("mousedown", (ev) => ev.preventDefault());
        b.addEventListener("click", () => press(k));
        r.appendChild(b);
      });
      kb.appendChild(r);
    });
  }

  // The keyboard is an overlay, so the view underneath has to give up exactly
  // its height -- measured, because the key size is viewport-relative.
  function showKeyboard() {
    kb.classList.remove("hidden");
    document.body.classList.add("osk-open");
    document.documentElement.style.setProperty("--osk-h", kb.offsetHeight + "px");
  }

  function hideKeyboard() {
    kb.classList.add("hidden");
    document.body.classList.remove("osk-open");
    document.documentElement.style.setProperty("--osk-h", "0px");
    active = null;
  }

  function insert(t) {
    if (!active) return;
    let s = null, e = null;
    try { s = active.selectionStart; e = active.selectionEnd; } catch (x) {}
    if (s == null) active.value += t;
    else { active.value = active.value.slice(0, s) + t + active.value.slice(e); try { const c = s + t.length; active.setSelectionRange(c, c); } catch (x) {} }
    active.dispatchEvent(new Event("input", { bubbles: true }));
  }

  function back() {
    if (!active) return;
    let s = null, e = null;
    try { s = active.selectionStart; e = active.selectionEnd; } catch (x) {}
    if (s == null) active.value = active.value.slice(0, -1);
    else if (s === e) { if (s === 0) return; active.value = active.value.slice(0, s - 1) + active.value.slice(e); try { active.setSelectionRange(s - 1, s - 1); } catch (x) {} }
    else { active.value = active.value.slice(0, s) + active.value.slice(e); try { active.setSelectionRange(s, s); } catch (x) {} }
    active.dispatchEvent(new Event("input", { bubbles: true }));
  }

  function press(k) {
    if (!active) return;
    if (k === "shift") { layout = layout === "shift" ? "default" : "shift"; render(); return; }
    if (k === "symbols") { layout = "symbols"; render(); return; }
    if (k === "abc") { layout = "default"; render(); return; }
    if (k === "backspace") { back(); return; }
    if (k === "space") { insert(" "); return; }
    if (k === "done") { const focused = active; hideKeyboard(); focused.blur(); return; }
    insert(k);
    if (layout === "shift") { layout = "default"; render(); }
  }

  document.addEventListener("focusin", (e) => {
    if (typeable(e.target)) {
      if (hideTimer) { clearTimeout(hideTimer); hideTimer = null; }
      active = e.target; layout = "default"; render(); showKeyboard();
    }
  });
  document.addEventListener("focusout", () => {
    hideTimer = setTimeout(() => { if (!typeable(document.activeElement)) hideKeyboard(); }, 200);
  });
})();
</script>
